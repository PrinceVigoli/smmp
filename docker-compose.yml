services:
  smmp:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Override DATABASE_URL to use the persistent volume path
      - DATABASE_URL=file:./data/prod.db
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - smmp-data:/app/data
    restart: unless-stopped

volumes:
  smmp-data:
